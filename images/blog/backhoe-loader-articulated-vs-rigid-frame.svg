<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Simplified diagram comparing an articulated backhoe loader that bends at a centre pin against a rigid-frame machine that steers its front wheels, with the resulting turning circles">
  <rect x="0" y="0" width="800" height="480" fill="#FDFCF8"/>
  <text x="400" y="40" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#1A1A1A">Two frames, two ways to turn</text>

  <rect x="16" y="60" width="376" height="356" rx="14" fill="#FFFFFF" stroke="#0F6E56" stroke-width="3"/>
  <text x="204" y="100" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#0F6E56">ARTICULATED</text>
  <text x="204" y="130" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#555555">the body bends at a pin</text>

  <!-- rear half -->
  <rect x="228" y="160" width="118" height="46" rx="7" fill="#F1EFE9" stroke="#1A1A1A" stroke-width="2.4"/>
  <!-- front half folded 30 degrees around the centre pin -->
  <g transform="rotate(-30 228 183)">
    <rect x="108" y="160" width="120" height="46" rx="7" fill="#F1EFE9" stroke="#1A1A1A" stroke-width="2.4"/>
  </g>
  <circle cx="228" cy="183" r="10" fill="#E8913A" stroke="#1A1A1A" stroke-width="2.2"/>
  <text x="330" y="176" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#555555">rear</text>
  <text x="136" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#555555">loader</text>

  <circle cx="204" cy="352" r="56" fill="none" stroke="#0F6E56" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="204" cy="352" r="5" fill="#0F6E56"/>
  <text x="204" y="360" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#0F6E56">tight circle</text>

  <rect x="408" y="60" width="376" height="356" rx="14" fill="#FFFFFF" stroke="#0F6E56" stroke-width="3"/>
  <text x="596" y="100" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#0F6E56">RIGID</text>
  <text x="596" y="130" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#555555">only the wheels turn</text>

  <!-- one continuous frame -->
  <rect x="466" y="160" width="270" height="46" rx="7" fill="#F1EFE9" stroke="#1A1A1A" stroke-width="2.4"/>
  <text x="596" y="189" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#333333">one welded frame</text>
  <!-- rear wheels straight -->
  <rect x="700" y="150" width="42" height="13" rx="3" fill="#333333"/>
  <rect x="700" y="203" width="42" height="13" rx="3" fill="#333333"/>
  <!-- front wheels steered 45 degrees -->
  <rect x="494" y="150" width="42" height="13" rx="3" fill="#333333" transform="rotate(45 515 156)"/>
  <rect x="494" y="203" width="42" height="13" rx="3" fill="#333333" transform="rotate(-45 515 209)"/>

  <circle cx="596" cy="352" r="56" fill="none" stroke="#0F6E56" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="596" cy="352" r="5" fill="#0F6E56"/>
  <text x="596" y="360" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#0F6E56">wider circle</text>

  <text x="400" y="452" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#1A1A1A">Compare turning radius, not steering angle.</text>
</svg>
