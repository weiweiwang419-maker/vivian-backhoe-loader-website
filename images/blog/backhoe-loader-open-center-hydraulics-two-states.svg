<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Simplified diagram of an open-centre hydraulic circuit in two states: with no lever pulled the pump flow passes straight through the valve centre and back to the tank at a few bar; with a lever pulled the flow goes to the cylinder and the surplus goes over the relief valve at 20 MPa">
  <defs>
    <marker id="oc-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F6E56"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="480" fill="#FDFCF8"/>
  <text x="400" y="40" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#1A1A1A">One circuit, two states</text>

  <!-- LEFT: no lever -->
  <rect x="16" y="60" width="376" height="358" rx="14" fill="#FFFFFF" stroke="#0F6E56" stroke-width="3"/>
  <text x="204" y="99" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#0F6E56">NO LEVER</text>
  <text x="204" y="127" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#555555">spool sits in the middle</text>

  <circle cx="64" cy="210" r="23" fill="#E8913A" stroke="#1A1A1A" stroke-width="2.4"/>
  <text x="64" y="218" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#1A1A1A">P</text>
  <line x1="90" y1="210" x2="142" y2="210" stroke="#0F6E56" stroke-width="4" marker-end="url(#oc-ar)"/>

  <rect x="150" y="184" width="104" height="52" rx="6" fill="#F1EFE9" stroke="#1A1A1A" stroke-width="2.4"/>
  <line x1="158" y1="210" x2="246" y2="210" stroke="#0F6E56" stroke-width="6"/>
  <text x="202" y="256" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#555555">open centre</text>

  <line x1="258" y1="210" x2="314" y2="210" stroke="#0F6E56" stroke-width="4" marker-end="url(#oc-ar)"/>
  <rect x="318" y="186" width="58" height="48" rx="6" fill="#F1EFE9" stroke="#1A1A1A" stroke-width="2.4"/>
  <text x="347" y="256" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#555555">tank</text>

  <rect x="48" y="286" width="312" height="100" rx="10" fill="#FFF4E8" stroke="#E8913A" stroke-width="2.4"/>
  <text x="204" y="324" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#B25A12">all of it, straight home</text>
  <text x="204" y="354" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" fill="#7A4A18">full flow · a few bar</text>
  <text x="204" y="378" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#7A4A18">the pump's work becomes heat</text>

  <!-- RIGHT: lever pulled -->
  <rect x="408" y="60" width="376" height="358" rx="14" fill="#FFFFFF" stroke="#0F6E56" stroke-width="3"/>
  <text x="596" y="99" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#0F6E56">LEVER PULLED</text>
  <text x="596" y="127" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#555555">spool shifted off centre</text>

  <circle cx="464" cy="210" r="23" fill="#E8913A" stroke="#1A1A1A" stroke-width="2.4"/>
  <text x="464" y="218" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#1A1A1A">P</text>
  <line x1="490" y1="210" x2="542" y2="210" stroke="#0F6E56" stroke-width="4" marker-end="url(#oc-ar)"/>

  <rect x="550" y="184" width="104" height="52" rx="6" fill="#F1EFE9" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M 558 210 H 598 V 197 H 646" fill="none" stroke="#0F6E56" stroke-width="5" marker-end="url(#oc-ar)"/>
  <path d="M 596 210 V 266" fill="none" stroke="#C0392B" stroke-width="4"/>

  <rect x="680" y="172" width="56" height="48" rx="6" fill="#F1EFE9" stroke="#1A1A1A" stroke-width="2.4"/>
  <line x1="736" y1="196" x2="780" y2="196" stroke="#333333" stroke-width="6"/>
  <text x="708" y="160" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#555555">cylinder</text>

  <rect x="566" y="266" width="60" height="34" rx="5" fill="#FFECEC" stroke="#C0392B" stroke-width="2.2"/>
  <text x="596" y="289" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#C0392B">relief</text>
  <line x1="628" y1="283" x2="662" y2="283" stroke="#C0392B" stroke-width="4" marker-end="url(#oc-ar)"/>
  <rect x="666" y="266" width="56" height="34" rx="5" fill="#F1EFE9" stroke="#1A1A1A" stroke-width="2.2"/>
  <text x="694" y="322" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#555555">tank</text>

  <rect x="456" y="336" width="312" height="64" rx="10" fill="#E9F5F0" stroke="#0F6E56" stroke-width="2.4"/>
  <text x="612" y="370" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#0F6E56">surplus over relief · 20 MPa</text>

  <text x="400" y="452" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#1A1A1A">Same pump, same pipes — the lever only redirects the flow.</text>
</svg>
